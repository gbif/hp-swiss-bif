blank:
  klass: hero-suisse
  markdownContent: |
    <style>
      .hero-swiss-node {
        position: relative;
        margin: 0;
        min-height: 600px;
        aspect-ratio: 16 / 9;
        background-image: url('{{ site.data.images.home.src }}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        color: white;
      }
      .hero-swiss-node .hero-content {
        width: 35%;
        min-width: 280px;
        box-sizing: border-box;
        padding: 40px;
        text-align: left;
        background: rgba(0, 0, 0, 0.25);
      }
      .hero-swiss-node h1 {
        font-family: Cambria, Georgia, serif;
        margin: 0;
        font-size: 40px;
        font-weight: 200;
        line-height: 1.1;
      }
      .hero-swiss-node p {
        font-family: Cambria, Georgia, serif;
        margin: 12px 0 0 0;
        font-size: 18px;
        font-weight: 400;
      }
      .hero-swiss-node .image-credit {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 2;
        display: flex;
        align-items: center;
      }
      .hero-swiss-node .image-credit .credit-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgb(237, 237, 237);
        color: rgb(181, 181, 181);
        font-size: 10px;
        font-weight: 700;
        font-style: italic;
        cursor: default;
        flex-shrink: 0;
      }
      .hero-swiss-node .image-credit .credit-text {
        display: none;
        margin-left: 8px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        white-space: nowrap;
      }
      .hero-swiss-node .image-credit:hover .credit-text {
        display: block;
      }
    </style>
    <div class="hero-swiss-node">
      <div class="hero-content">
        <h1>SwissBIF</h1>
        <p>Mobiliser les connaissances sur la biodiversité pour la suisse et le monde</p>
      </div>
      <div class="image-credit">
        <span class="credit-icon">i</span>
        <span class="credit-text">{{ site.data.images.home.caption }}</span>
      </div>
    </div>

# ============================================================================================================================
# STATISTICS (GBIF)
# Published specimens : <span data-ajax-url="https://api.gbif-uat.org/v1/occurrence/search?publishing_org=d80fedd1-940b-4669-871d-b9c990cf650e&limit=0"></span>
# ============================================================================================================================
